# Downloads the Lidl store list from OpenStreetMap and saves it as
# supabase/seed/stores.csv in this repository. Run it by hand:
# Actions tab > "Refresh Lidl stores" > Run workflow. Takes about 5 minutes.
name: Refresh Lidl stores

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download stores from OpenStreetMap
        run: node scripts/fetch-stores.mjs

      - name: Add town and village names (GeoNames, CC BY 4.0)
        run: |
          mkdir -p "$RUNNER_TEMP/geonames"
          for cc in FR DE IT PL ES GB IE BE CH AT; do
            if curl -fsSL --retry 3 --max-time 300 -o "$RUNNER_TEMP/geonames/$cc.zip" "https://download.geonames.org/export/dump/$cc.zip"; then
              unzip -o -q "$RUNNER_TEMP/geonames/$cc.zip" "$cc.txt" -d "$RUNNER_TEMP/geonames" || echo "::warning::Could not unzip $cc"
            else
              echo "::warning::Could not download GeoNames for $cc"
            fi
          done
          GEONAMES_DIR="$RUNNER_TEMP/geonames" node scripts/add-places.mjs

      - name: Save the file in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/seed/stores.csv
          if git diff --cached --quiet; then
            echo "The store list has not changed."
          else
            git commit -m "Refresh Lidl store list from OpenStreetMap"
            git push
          fi

      - name: Also offer the file as a download on this run's page
        uses: actions/upload-artifact@v4
        with:
          name: stores-csv
          path: supabase/seed/stores.csv
